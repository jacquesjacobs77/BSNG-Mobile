name: Android prototype APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "App.tsx"
      - "src/**"
      - "app.json"
      - "package*.json"
      - "index.js"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      CI: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Install packages
        run: npm install --no-audit --no-fund
      - name: Check TypeScript
        run: npm run check
      - name: Test local GC demo
        run: npm test
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Generate Android launcher icons
        run: |
          python -m pip install pillow==11.3.0
          python scripts/generate_assets.py
      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install
      - name: Configure Gradle memory for Expo updates
        run: |
          # Expo's generated default Metaspace cap was exhausted during app:packageRelease.
          # Limit concurrent workers and move Kotlin compilation into the Gradle process.
          cat >> android/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2560m -XX:MaxMetaspaceSize=1536m -Dfile.encoding=UTF-8
          org.gradle.workers.max=2
          org.gradle.parallel=false
          kotlin.compiler.execution.strategy=in-process
          EOF
          grep -E 'org.gradle.jvmargs|org.gradle.workers.max|org.gradle.parallel|kotlin.compiler.execution.strategy' android/gradle.properties | tail -n 4
      - name: Compile installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --max-workers=2 --no-parallel
      - name: Upload prototype APK
        uses: actions/upload-artifact@v4
        with:
          name: BSNG-Research-Studio-v0.2-prototype-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
