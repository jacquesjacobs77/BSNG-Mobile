name: BSNG v1.0 controlled next-ten GRCh38 genomic batches (hard stop at 13)
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/bsng-v10-controlled-next-ten.yml'

permissions:
  contents: write

concurrency:
  # Same campaign concurrency key as the original v0.9 single-batch runner.
  # Two operators MUST NOT write the same scientific checkpoint simultaneously.
  group: bsng-v09-official-grch38-sequential-reference-campaign
  cancel-in-progress: false

jobs:
  controlled-ten-real-reference-batches:
    name: Exact 10 real reference 10M-bp batches; stop after B000013
    runs-on: ubuntu-latest
    timeout-minutes: 130
    env:
      GH_TOKEN: ${{ github.token }}
      BSNG_TRIAL_MAX_ADDITIONAL_BATCHES: '10'
      BSNG_TRIAL_FIXED_TOTAL_COMPLETED_BATCHES: '13'
    steps:
      - name: Check out safety-reviewed independent controller (not the mutable scientific engine)
        uses: actions/checkout@v4
      - name: Check out original frozen, validated authentic GRCh38 research engine separately
        uses: actions/checkout@v4
        with:
          ref: e91c8d85b0c92d56666383e9e7e3a36d0133d391
          path: engine
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify fixed budget, immutable CTCF model and single-run orchestration syntax
        run: |
          bash -n scripts/run_controlled_10_batch_campaign.sh
          node --check scripts/audit_bounded_10_batch.mjs
          node --test tests/bounded-10-batch-policy.test.mjs
          test "$(git -C engine rev-parse HEAD)" = "e91c8d85b0c92d56666383e9e7e3a36d0133d391"
      - name: Restore optional previously verified NCBI FASTA cache (not canonical research storage)
        uses: actions/cache@v4
        with:
          path: /tmp/bsng-v09-real-source
          key: bsng-ncbi-grch38-p14-gcf00000140540-source-v1
      - name: Run bounded official GRCh38.p14 100M-base continuation, store verified receipt after each
        run: bash scripts/run_controlled_10_batch_campaign.sh
      - name: Archive reproducible ten-batch trial audit and per-step research log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BSNG-v10-next-ten-controlled-GRCh38-research-audit-${{ github.run_id }}
          path: |
            bsng-ten-batch-final-audit.json
            bsng-ten-batch-logs/
          retention-days: 90
          if-no-files-found: warn
