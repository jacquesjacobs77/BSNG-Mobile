name: BSNG research engine checks
on:
  push:
    branches:
      - feature/bsng-hypothesis-assay-v0.3
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research_assay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: TypeScript static checks
        run: npm run check
      - name: Run all regression tests, including hypothesis assay
        run: npm test
      - name: Produce labeled synthetic fixture
        run: node scripts/run_recognition_fixture.mjs
      - name: Upload machine-readable reproducibility fixture
        uses: actions/upload-artifact@v4
        with:
          name: BSNG-software-assay-regression-fixture
          path: artifacts/bsng-synthetic-assay-fixture.json
          retention-days: 30
